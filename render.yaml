###############################################################################
# Render Blueprint — ServiVizinhos
# -----------------------------------------------------------------------------
# 2 servicos:
#   1) backend  -> FastAPI + MongoDB
#   2) frontend -> React Static Site
###############################################################################

services:
  # ============================================================
  # 1) BACKEND - FastAPI
  # ============================================================
  - type: web
    name: servivizinhos-backend
    runtime: python
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /api/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URL
        sync: false               # mongodb+srv://user:pass@cluster.xxx.mongodb.net/
      - key: DB_NAME
        value: servivizinhos
      - key: CORS_ORIGINS
        sync: false               # https://servivizinhos-frontend.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: EMERGENT_LLM_KEY
        sync: false               # sk-emergent-XXXX (opcional)

  # ============================================================
  # 2) FRONTEND - React Static
  # ============================================================
  - type: web
    name: servivizinhos-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: yarn install --frozen-lockfile --network-timeout 600000 && yarn build
    staticPublishPath: ./build
    autoDeploy: true
    envVars:
      - key: REACT_APP_BACKEND_URL
        sync: false               # https://servivizinhos-backend.onrender.com
      - key: NODE_VERSION
        value: 20.11.1
      - key: CI
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
